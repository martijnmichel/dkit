name: Deploy www image

on:
  push:
    branches: [main]
    paths:
      - "apps/www/**"
      - "packages/registry/**"
      - ".github/workflows/deploy-www.yml"

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/www/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dkit-www:latest
            ghcr.io/${{ github.repository_owner }}/dkit-www:${{ github.sha }}
