# Production-style deploy for https://dkit.run
# Pull a published image, or build locally first:
#   docker compose -f docker/www/compose.yaml build
#   docker tag dkit-www:local ghcr.io/martijnmichel/dkit-www:latest
#
# Put Caddy/Traefik/Cloudflare in front for TLS → this container :80
services:
  www:
    image: ghcr.io/martijnmichel/dkit-www:latest
    restart: unless-stopped
    ports:
      - "${DKIT_WWW_PORT:-8080}:80"
