services:
  database:
    image: postgres:16-alpine
    volumes:
      - directus_pg:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus
      POSTGRES_DB: directus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine

  directus:
    image: directus/directus:12.2
    ports:
      - "8055:8055"
    volumes:
      - directus_uploads:/directus/uploads
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
    environment:
      SECRET: "dkit-dev-secret-change-me"
      DB_CLIENT: "pg"
      DB_HOST: "database"
      DB_PORT: "5432"
      DB_DATABASE: "directus"
      DB_USER: "directus"
      DB_PASSWORD: "directus"
      CACHE_ENABLED: "true"
      CACHE_STORE: "redis"
      REDIS: "redis://cache:6379"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "dkit-admin"
      PUBLIC_URL: "http://localhost:8055"
      WEBSOCKETS_ENABLED: "true"

  # Optional: docker compose --profile v11 up
  directus11:
    profiles: ["v11"]
    image: directus/directus:11.3
    ports:
      - "8056:8055"
    volumes:
      - directus11_uploads:/directus/uploads
    depends_on:
      database:
        condition: service_healthy
    environment:
      SECRET: "dkit-dev-secret-change-me"
      DB_CLIENT: "pg"
      DB_HOST: "database"
      DB_PORT: "5432"
      DB_DATABASE: "directus11"
      DB_USER: "directus"
      DB_PASSWORD: "directus"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "dkit-admin"
      PUBLIC_URL: "http://localhost:8056"

volumes:
  directus_pg:
  directus_uploads:
  directus11_uploads:
